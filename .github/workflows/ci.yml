name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  repoguard-security-scan:
    name: RepoGuard Pre-Execution Security Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run RepoGuard Security Check
        uses: ALADETAN-IFE/repoguard-action@1f5947a155f654749155b712564e6cb0c45e63d7 # v1
        with:
          minimum-severity: medium
          fail-on: high
  ci:
    needs: [repoguard-security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run check-format
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
